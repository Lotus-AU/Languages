      Description: ペット/キルボタンで、会議中に投獄するプレイヤーを選択します。会議では、設定によって投獄されたプレイヤーが全員に表示される場合があります。投獄されたプレイヤーは投票できず、会議中に役職能力も使えません。ただし、他のプレイヤーも投獄されたプレイヤーには投票できません。\nあなたはそのプレイヤーに投票することで処刑できます。設定によっては、相手がクルーメイトだった場合にあなたが自殺することがあります。処刑回数には上限があります。\n設定によっては、投獄されたプレイヤーがあなたに合わせて「投票」します。つまり、あなたが誰かに投票すると、そのプレイヤーも同じ相手に投票するよう強制されます。
