      RoleName: ターンコート
      Blurb: クルーを裏切る...かどうかはあなた次第
      Description: ターンコートは、最初はクルーメイトチームに所属しているニュートラル役職です。ゲーム終了時にはクルーと一緒に勝利します。ただし、会議で自分に投票することでクルーを裏切る選択ができます。その結果、ターンコートの役職は全員に公開されます。クルーに即座に投票されるのを防ぐため、公開前にキルボタンでプレイヤーをマークできます。あなたが死亡した場合、そのプレイヤーも死亡するため、生き残るための交渉材料として利用できます。対象のプレイヤーは自分が犠牲者だと知らないため、あなたは嘘をついて、まったく別の人物（たとえばドクター）を責めることもできます。
