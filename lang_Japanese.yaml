      Colorwars:
        Name: カラーウォーズ
        ButtonText: カラーウォーズ設定
        Description: カラーウォーズの設定を変更します。
        GamemodeDescription: プレイヤーはチーム分けされ、ランダムな色を割り当てられます。\n色変換モードが有効な場合、他のプレイヤーをキルしようとすると、そのプレイヤーの色が自分と同じ色に変わります。残りの色が1色になるとゲーム終了です。サドンデスが有効な場合、残りの色数がホストの設定した数以下になると、変換ではなく互いにキルするようになります。\n\n色変換モードが無効な場合、他の色のプレイヤーをキルして脱落させる必要があります。残りの色が1色になるとゲーム終了です。
