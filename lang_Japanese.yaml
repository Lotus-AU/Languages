        PlayerStartsTurn: プレイヤー {0} が役職を選択中です。{1}秒以内に選ばない場合、自動でランダムが選択されます。
        GamemodeDescription: <size=95%>通常ゲームモードの派生ルールです。通常ゲームモードで使える役職はすべて使用できます。\n\nこのゲームモードでは、まず通常通り、アサインされる役職が選ばれます。ただし、その時点ではプレイヤーに割り当てず、候補リストに追加されるだけです。\nゲーム開始時に会議が開かれます。この会議中、各プレイヤーには自分専用の番号（カスタムID）が通知されます。プレイヤーは番号の小さい順（1から参加人数まで）に、候補リストからランダムに提示された役職の中から1つずつ選びます。\n選択肢の数はホストが設定します。任意のプレイヤーに投票すると選択を変更できます。提示された役職が気に入らない場合は、常に「ランダム」という追加選択肢があります。\nランダムを選ぶと、候補リストに残っていて、まだ誰にも選ばれていない役職から1つが選ばれます。選択内容に問題がなければ、スキップ投票で確定できます。\n制限時間内に役職を選ばなかった場合は、自動的にランダムが選ばれます。選んだ選択肢はチャットで公開されます。\nその役職が選ばれたことは全員に伝わりますが、誰に割り当てられたかは分かりません。\n\n全員が役職を選び終えると会議が終了し、通常通りゲームが始まります。
