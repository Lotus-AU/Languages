    Romantic:
      RoleName: マンティック
      Blurb: 生涯を共にするパートナーを選ぶ
      Description: ロマンティックは、ゲーム最初の会議中に必ずパートナーにするプレイヤーへ投票しなければなりません。選ばなかった場合は死亡します。パートナーを選ぶと、ロマンティックはペットボタンで一時的にパートナーへシールドを付与できます。\n\nロマンティックのパートナーが死亡した場合、ホスト設定に応じて復讐のロマンティック、または冷酷なロマンティックに変化します。\n\nホスト設定によって、ロマンティックはパートナーと一緒に勝利できる場合も、単独勝利としてパートナーなしで勝利できる場合もあります。
