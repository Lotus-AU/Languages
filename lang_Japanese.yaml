      RoleName: ヴァイパー
      Blurb: キルした死体を溶かす
      Description: ヴァイパーは、プレイヤーをキルした後に死体を溶かすインポスター役職です。一定時間が経過すると死体は完全に消え、通報できなくなります。溶解には3段階あり、完全に消えるまでの時間はホストが設定します。
    Drafter:
      RoleName: ドラフター
      Blurb: 次の役職を選ぶ
      Description: ゲーム開始時、ドラフターは提示された役職の中から自分の役職を選べます。この役職はドラフトゲームモードでのみ出現します。
    Seeker:
      RoleName: シーカー
      Blurb: 制限時間内にハイダーを全員キルする
      Description: バニラのAmong Usに存在する役職です。時間切れになる前に全員をキルすると勝利します。
    Hider:
      RoleName: ハイダー
      Blurb: シーカーから隠れる
      Description: バニラのAmong Usに存在する役職です。時間切れまでシーカーにキルされなければ勝利します。ベントをうまく活用しましょう。
    Child:
      EarDamageReason: 耳へのダメージ
      ScreamedDeathReason: 叫び声
      RoleName: 子ども
      Blurb: キルされると即勝利
      Description: 'これはエイプリルフール役職です。4月1日から4月7日までの間だけ、設定に表示され出現します。\n子どもはクルーメイト役職で、<b>ラウンド中</b>にキルされると即座に単独勝利します。会議中にキルされた場合（例: 推測による死亡）は勝利しません。'
    Drunk:
      RoleName: 酔っぱらい
      Blurb: 操作が反転する
      Description: これはエイプリルフール役職です。4月1日から4月7日までの間だけ、設定に表示され出現します。\nこのサブロールを持つプレイヤーは、生存中の操作が反転します。上は下に、左は右になります。
    Lagger:
      RoleName: ラガー
      Blurb: ランダムに停止する
      Description: これはエイプリルフール役職です。4月1日から4月7日までの間だけ、設定に表示され出現します。\n0.1〜20秒ごとに、プレイヤーは0.05〜4秒間その場で強制停止します。そのため、マップ内を移動しにくくなります。プレイヤーが死亡すると、この効果は止まります。
    Slowpoke:
      RoleName: のろま
      Blurb: とても遅い
      Description: これはエイプリルフール役職です。4月1日から4月7日までの間だけ、設定に表示され出現します。\nプレイヤーの速度が大幅に低下します（具体的には4分の1になります）。プレイヤーが死亡すると、速度は通常に戻ります。
    Sneezer:
      RoleName: くしゃみ
      Blurb: うっかり会議を招集する
      Description: これはエイプリルフール役職です。4月1日から4月7日までの間だけ、設定に表示され出現します。\n初回以外の各ラウンドで、開始から30〜120秒後に緊急会議を強制的に招集します。その時間までにプレイヤーが死亡した場合、会議は招集されません。
